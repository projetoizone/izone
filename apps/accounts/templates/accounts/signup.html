{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Sign Up{% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}

    <!-- {{ form.username.label }}
    {{ form.username }} -->

    {% for field in form %}
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
            <span class="field-errors" style="color: red;">{{ field.errors }}</span>
        {% endif %}
        <br>
    {% endfor %}
    <button type="submit">Sign Up</button>
</form>


{% endblock %}
