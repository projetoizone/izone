[project]
name = "izone"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "coverage>=7.17",
]

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/tests/*",
    "config/asgi.py",
    "config/wsgi.py",
]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
title = "iZone coverage"
